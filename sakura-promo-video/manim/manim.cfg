# Manim 流程动画的统一画布、帧率与输出缓存配置，与 1080p/30fps 宣传视频保持一致。
# Share canvas/frame-rate/output-cache configuration matching the 1080p/30fps promotional film.
[CLI]
renderer = cairo
background_color = #FAF7F9
pixel_width = 1920
pixel_height = 1080
frame_width = 16
frame_height = 9
frame_rate = 30
media_dir = ../.cache/manim
disable_caching = True
