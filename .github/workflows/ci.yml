name: Verify
on:
  push:
  pull_request:
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      SAKURA_QEMU_DIR: ${{ matrix.os == 'ubuntu-latest' && '/usr/bin' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils
        if: runner.os == 'Linux'
      - run: npm run setup
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
  virtual-machines:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      SAKURA_QEMU_DIR: ${{ matrix.os == 'ubuntu-latest' && '/usr/bin' || '' }}
      SAKURA_TEST_ACCELERATOR: tcg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils
        if: runner.os == 'Linux'
      - run: npm run setup
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run verify:vm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-results-${{ matrix.os }}
          path: |
            artifacts/*.log
            artifacts/boot-timings*.json
            test-results/
