# 中文：双平台发布门禁；先验证源码与运行包，再执行依赖真实 VM 的集成情景。
# English: Cross-platform release gates; verify sources/runtime packages before integration cases requiring real VMs.
name: Verify
on:
  push:
  pull_request:
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      SAKURA_QEMU_DIR: ${{ matrix.os == 'ubuntu-latest' && '/usr/bin' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use canonical Windows temporary paths
        if: runner.os == 'Windows'
        run: node -e "const fs=require('node:fs');const p=fs.realpathSync(process.env.RUNNER_TEMP);fs.appendFileSync(process.env.GITHUB_ENV,'TEMP='+p+'\nTMP='+p+'\n');"
      - name: Install pinned Windows native compilers
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/setup-windows-toolchains.ps1
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils
        if: runner.os == 'Linux'
      - run: npm run setup
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
  # 中文：真实 VM 阶段使用受控 TCG 后端，结果作为 CI 材料留存。
  # English: Real-VM verification uses the controlled TCG backend and retains results as CI artifacts.
  virtual-machines:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      SAKURA_QEMU_DIR: ${{ matrix.os == 'ubuntu-latest' && '/usr/bin' || '' }}
      SAKURA_TEST_ACCELERATOR: tcg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use canonical Windows temporary paths
        if: runner.os == 'Windows'
        run: node -e "const fs=require('node:fs');const p=fs.realpathSync(process.env.RUNNER_TEMP);fs.appendFileSync(process.env.GITHUB_ENV,'TEMP='+p+'\nTMP='+p+'\n');"
      - name: Install pinned Windows native compilers
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/setup-windows-toolchains.ps1
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils
        if: runner.os == 'Linux'
      - run: npm run setup
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run verify:vm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-results-${{ matrix.os }}
          path: |
            artifacts/*.log
            artifacts/boot-timings*.json
            test-results/
